[workspace]
resolver = "2"
members = [
    "crates/glide-common",
    "crates/glide-graph",
    "crates/glide-core",
    "crates/glide-llm",
    "crates/glide-tui",
    "crates/glide-vault",
    "crates/glide-play",
    "crates/glide-cli",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matthewvilaysack/glide"
authors = ["Glide <hello@tryglide.dev>"]

[workspace.dependencies]
glide-common = { path = "crates/glide-common" }
glide-graph  = { path = "crates/glide-graph" }
glide-core   = { path = "crates/glide-core" }
glide-llm    = { path = "crates/glide-llm", default-features = false }
glide-tui    = { path = "crates/glide-tui" }
glide-vault  = { path = "crates/glide-vault", default-features = false }
glide-play = { path = "crates/glide-play" }

anyhow         = "1"
thiserror      = "1"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
toml           = "0.8"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories    = "5"
clap           = { version = "4", features = ["derive", "env"] }
clap_complete  = "4"
rusqlite       = { version = "0.31", features = ["bundled", "chrono"] }
chrono         = { version = "0.4", features = ["serde"] }
git2           = { version = "0.18", default-features = false }
globset        = "0.4"
ignore         = "0.4"
walkdir        = "2"
regex          = "1"
is-terminal    = "0.4"
owo-colors     = "4"
ratatui        = "0.29"
rmcp           = { version = "3.2", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
schemars       = "1"
tokio          = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
wasm-bindgen = "=0.2.128"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The browser engine is downloaded on every page view; optimise for size.
[profile.release.package.glide-play]
opt-level = "z"
