[package]
name = "glide-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "glide"
path = "src/main.rs"

[features]
default = ["console"]
console = ["dep:glide-tui"]
anthropic = ["glide-llm/anthropic"]

[dependencies]
glide-common = { workspace = true }
glide-graph = { workspace = true }
glide-core = { workspace = true }
glide-llm = { workspace = true }
glide-tui = { workspace = true, optional = true }
glide-vault = { workspace = true, features = ["home"] }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { workspace = true }
walkdir = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.3"
url = "2"
schemars = { workspace = true }
tokio = { workspace = true, features = ["net", "signal"] }
clap = { workspace = true }
clap_complete = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
is-terminal = { workspace = true }
owo-colors = { workspace = true }
directories = { workspace = true }

[dev-dependencies]
glide-play = { workspace = true }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
